# --- LOCATIONS ---
world:
  locations:
  # SPAWN
    spawn:
      name: "Cyber City"
      description: "A city made of cyber things with a cyber sky."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        west: "road_traffic"
        east: "carnival"
      spawns: ["dummy"]
      items: []

  # CITY ROAD TRAFFIC
    road_traffic:
      name: "City Road Traffic"
      description: "Only the red light pass throught your eyes in this place."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        north: "city_too"
        east: "spawn"
      spawns: []
      items: []

  # CITY TOO
    city_too:
      name: "City Too"
      description: "The second best city made of cyber things under a fake cyber sky."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        north: "manor_entrance"
        south: "road_traffic"
      spawns: ["virovirokun"]
      items: ["bandage_max"]

  # MANOR ENTRANCE
    manor_entrance:
      name: "Manor Entrance"
      description: "A giant manor that is like as tall that 5 You."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        west: "hall_shop"
        east: "back_street"
        south: "city_too"
      spawns: ["guard_dog", "k_round"]
      items: []

  # BACK STREET
    back_street:
      name: "Back Street"
      description: "A place surrounded by iron fences with only one light."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        west: "manor_entrance"
        east: "cyber_field"
      spawns: ["maus", "susie"]
      items: []

  # CYBER FIELD
    cyber_field:
      name: "Cyber Field"
      description: "The ground seem like grass but it's just an image not in png."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        west: "back_street"
        south: "trash_area"
      spawns: ["kawkaw"]
      items: ["trefoil"]

  # TRASH AREA
    trash_area:
      name: "Trash Area"
      description: "The place smells bad, there are a lot of trashs and rats (it's only drawing of that)."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        north: "cyber_field"
        south: "carnival"
      spawns: ["spamton"]
      items: []

  # CARNIVAL
    carnival:
      name: "Carnival"
      description: "A giant circus is on the middle and a man is yelling 'I can do anything!' every 10 seconds."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        north: "trash_area"
        west: "spawn"
      spawns: ["ralsei"]
      items: ["bandage"]

  # MANOR HALL
    hall_shop:
      name: "Hall's Shop"
      description: "Queen's personnal shop where she buy she best acid soda of the world."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        north: "queen_castle"
        east: "manor_entrance"
      spawns: ["swatch"]
      items: []

  # QUEEN CASTLE
    queen_castle:
      name: "Queen Castle Floor 1"
      description: "Floor 0 is right above but the entrance was condamned because it was covered in flour."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        east: "throne"
        south: "hall_shop"
      spawns: ["swatchlings"]
      items: []

  # QUEEN THRONE
    throne:
      name: "Queen's Throne"
      description: "The throne of the Queen. I can't say much, there is only that in that room."
      tile_map: "assets/sprites/player/kris_walk.png"
      exits:
        west: "queen_castle"
      spawns: ["queen"]
      items: []

# SPECIAL ROOMS
  # EGG ROOM
    egg_room:
      name: "???"
      description: "???"
      tile_map: "assets/sprites/player/kris_walk.png"
      special: true
      exits:
        north: "road_traffic"
        south: "road_traffic"
        east: "road_traffic"
        west: "road_traffic"
      spawns: []
      items: ["egg"]

  # SECRET ROOM
    secret_room:
      name: "Secret Room"
      description: "It's a secret room with a secret character that you can see."
      tile_map: "assets/sprites/player/kris_walk.png"
      special: true
      exits:
        east: "trash_area"
      spawns: ["sans"]
      items: []

# --- ITEMS ---
items:
  egg:
    name: "EGG"
    description: "Just an EGG."
    type: "key"

  # KEY ITEM
  chocolate_bar:
    name: "Chocolate Bar"
    description: "A delicious bar of chocolate by Mr.Biste."
    type: "key"

  wheat:
    name: "Wheat"
    description: "Wet wheat."
    type: "key"

  milk:
    name: "Milk"
    description: "You can see your reflect throught the white substance."
    type: "key"

  chocolate_cake:
    name: "Chocolate Cake"
    description: "Made by Ralsei, by Ralsei, for Susie."
    type: "key"

  remote:
    name: "The Remote"
    description: "Can H[a]ck the [Ga]te."
    type: "key"

  key_a:
    name: "Key A"
    description: "Key with 'A' noted on it."
    type: "key"

  key_b:
    name: "Key B"
    description: "Key with a drawing of a bee on it."
    type: "key"

  pipis:
    name: "Pipis"
    description: "An invasive species of freshwater clam."
    type: "key"

  # WEAPONS
  wood_blade:
    name: "Wood Blade"
    description: "A wooden practice blade with a carbon-reinforced core. Mightier than a sword? Maybe equal at best."
    type: "weapon"
    damage: 5

  trefoil:
    name: "Trefoil"
    description: "Mossy rapier with a clover emblem. Covered in green clovers and rainbows."
    type: "weapon"
    damage: 7

  saber10:
    name: "Saber10"
    description: "A saber made of 10 cactus needles. Fortunately, can deal more than 10 damage."
    type: "weapon"
    damage: 11

  ultimate_sword:
    name: "Ultimate Sword"
    description: "'The Ultimate Weapon' that's what is written on the blade."
    type: "weapon"
    damage: 1

  # CONSUMABLES
  bandage:
    name: "Bandage"
    description: "It has cartoon characters on it."
    type: "consumable"
    hp: 4

  bandage_max:
    name: "Bandage Max"
    description: "It has big cartoon characters on it."
    type: "consumable"
    hp: 8

  giga_salad:
    name: "Giga Salad"
    description: "An enormous salad... but, it's just lettuce, so it's worthless."
    type: "consumable"
    hp: 5

  cd_bagel:
    name: "cd_bagel"
    description: "A bagel with a reflective inside. Makes music with each bite."
    type: "consumable"
    hp: 8

  revive_mint:
    name: "Revive Mint"
    description: "Heals a fallen ally to MAX HP. A minty green crystal."
    type: "consumable"
    hp: 9999

# --- ENTITIES ---
entities:
  dummy:
    name: "Dummy"
    description: "It's just a simple dummy."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "..."
      talk_2: "...."
      talk_3: "....."
      talk_4: "......"
      talk_5: "It's a dummy. He can't talk."
      encounter: "The dummy stand here."
      check_default: "It's a dummy."
      neutral_1: "..."
      neutral_2: "...."
    type: "enemy"
    hp: 33

  virovirokun: # mini-games = just act
    name: "Virovirokun"
    description: "A virus with a slightly criminal streak... and a heart of gold."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      encounter: "Virovirokun floated in!"
      check_default: "The sick virus needs affordable healthcare."
      neutral_1: "Virovirokun is sweating suspiciously."
      neutral_2: "Virovirokun uses a text document as a tissue."
      neutral_3: "Virovirokun is poking round things with a spear."
      neutral_4: "Virovirokun is beeping a criminal tune."
      neutral_5: "Smells like cherry syrup."
      act_1: "You treated Virovirokun with a big smile. It's less infectious !"
      act_2: "You treated Virovirokun with joy. It's less infectious !"
      act_3: "You treated Virovirokun with care! It's no longer infectious!"
      low_hp: "Virovirokun looks extra sick."
      can_spare: "Virovirokun looks healthy."
    type: "enemy"
    hp: 50

  maus: # mini-games = catch mouses
    name: "Maus"
    description: "It dreams of re-enacting scenes from cat and mouse cartoons."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      encounter: "Maus blocked the way!"
      check_default: "It's just a little mouse living in a little house."
      neutral_1: "Maus is clicking and squeaking."
      neutral_2: "Maus is thinking about overly elaborate machines."
      neutral_3: "Maus keeps running between your feet."
      neutral_4: "Maus is keenly aware of the fear it invokes."
      neutral_5: "Maus would like to go to its favorite bistro in this marvelous city."
      neutral_6: "Smells like wood shavings."
      act_1: "Press [(SPACE)] To Trap!!!"
      act_result_failed: "Didn't catch anything..."
      act_result_won: "Caught the enemy!"
      low_hp: "Maus's clicking sounds more like splat noises."
      can_spare: "Maus is squeaking cheerfully."
    type: "enemy"
    hp: 80

  kawkaw: # mini-game = press space at the right times
    name: "KawKaw"
    description: "Nyon"
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      encounter: "Kawkaw wants to play!"
      check_default: "It thinks battle is play. Loves scarecrows. "
      neutral_1: "Kawkaw pecks the ground looking for treats."
      neutral_2: "Kawkaw wants to play with a throwing toy."
      neutral_3: "Kawkaw makes ueueueueue noises."
      neutral_4: "Kawkaw gathers sticks for nest and fetch."
      act_1: "Press [(SPACE)] To Find!!!"
      act_result_failed: "Bad number..."
      act_result_won: "Good number!"
      low_hp: "Kawkaw is licking its wounds."
      can_spare: "Kawkaw is ready to sleep in a nest. "
    type: "enemy"
    hp: 75

  swatchlings: # mini-game = make all oufits the same colors
    name: "Swatchlings"
    description: "A conical crow which lives in the ground. Disturbs Shi's crops, only because it wants to play with him."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      encounter: "Swatchlings bowed in!"
      check_default: "Happiest when their outfits are color-coordinated."
      neutral_1: "The Swatchlings wipe at the face of their chained pocketwatch, which is digital."
      neutral_2: "Smells like paint and feathers."
      neutral_3: "The Swatchlings are cleaning each other off with feather dusters."
      neutral_4: "Swatchlings flex their backs while bending over to inspect a teacup."
      neutral_5: "The Swatchlings are adjusting their hue and saturation."
      act_coldify_1: "Talked about the crunch of the last pickle in the refrigerator."
      act_coldify_2: "Talked about the chill of the wind on an ice skating pond."
      act_coldify_3: "Talked about the snow matted on your brother's nose."
      act_warmify_1: "Talked about the color of the summer sun shining on a beach ball."
      act_warmify_2: "Talked about the steam of a fresh hot chocolate."
      act_warmify_3: "Talked about the warmth of a loving embrace."
      act_check_oufit_half_warm: "Swatchling's color got a little bit warmer...!"
      act_check_oufit_half_cold: "Swatchling's color turned a lot/a little bit colder...!"
      act_check_oufit_nothing: "But Swatchling is already as warm/cold as can be!"
      act_check_oufit_green: "Swatchling's as become like grass."
      act_check_oufit_orange: "Swatchling's as become like a clementine."
      act_check_oufit_yellow: "Swatchling's as become like a banana."
      act_check_oufit_red: "Swatchling's as become like an apple."
      low_hp: "The Swatchling is dreading doing all of the work by itself."
      can_spare: "The Swatchlings are relieved their wardrobe has been coordinated. "
    type: "enemy"
    hp: 111

  guard_dog: # mini-games = make the dog comes to the player by ignoring it then pet it 5 times
    name: "Guard Dog"
    description: "It's so excited that it thinks fighting is just play."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "You shall not pass as I guard those gates."
      talk_2: "(even if you can pass by just going around...)."
      talk_3: "But if you want to pass. You shall met my delicious strength."
      talk_4: "Are you sure you want to fight me?"
      talk_5: "In reality I've lost the other remote of the gates. I can't let you pass."
      talk_6: "I've have one but it's mine."
      talk_7: "Are you sure you want to force you way through?"
      talk_8: "You have the remote. You shall pass."
      encounter: "This is a dog in a guard suit."
      check_default: "It's not very excited."
      check_1: "It's a bit excited."
      check_2: "It's excited but not enought to play."
      check_3: "It's so excited that it thinks fighting is just play."
      neutral_1: "Guard Dog is watching you intently."
      neutral_2: "Guard Dog is waiting for your command."
      neutral_3: "It smells like freshly-squeezed puppy juice."
      neutral_4: "Guard Dog is seeking affection."
      act_pet_1: "Greater Dog is too far away to pet. You just pet the air."
      act_pet_2: "You pet the dog."
      act_play_1: "Greater Dog is not excited enough to play with."
      act_play_2: "You play with the dog."
      act_ignore: "You ignore the dog. His face looks sad."
      low_hp: "Greater Dog is panting slowly."
      can_spare: "Greater Dog is contented."
      killed: "I... just wanted the ball..."
    talk_stages:
      - last: 7
      - last: 8
        wait_quest: "buy_remote"
        wait_for: "completed"
    type: "boss"
    hp: 150

  k_round: # mini-game = make the crown falls
    name: "K.Round"
    description: "Despite appearances, it's trying its best to defeat you."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "K.Round look at you. He thinks you are special."
      talk_2: "It give you a Key as a reward."
      encounter: "K.Round shuffles furiously."
      check_default: "Check? That's chess, not checkers!"
      neutral_1: "K.Round shuffles furiously."
      neutral_2: "K.Round is furious."
      neutral_3: "K.Round blocks the way."
      neutral_4: "K.Round is rolling around."
      act_bow: "You bowed to K. ROUND."
      act_bow_result: "It bowed back. Its crown loosened a little."
      check_bow_1: "Its crown start to move."
      check_bow_2: "Its crown is moving."
      check_bow_3: "Its crown is at the edge."
      check_bow_4: "Its crown start to fall."
      low_hp: "K.Round's shuffle becomes lethargic."
      spare: "K.Round lose his crown. He run away."
    talk_stages:
      - last: 2
        wait_quest: "buy_remote"
        wait_for: "completed"
    type: "boss"
    hp: 400

  queen: # mini-game = just win the fight
    name: "Queen"
    description: "The Queen that has stolen your moss to play with you."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "Oh! You're finally here!"
      talk_2: "Congratulation. You want your moss?"
      talk_3: "Distract me and I will give it to you."
      talk_4: "Wants to fight?"
      talk_5: "Well. Well. Well."
      talk_6: "You won. Congrats. I just wanted to play with you. I'm bored."
      talk_7: "Take your moss now."
      talk_8: "You can go now."
      encounter: "The tension feels electric."
      check_default: "The Queen"
      neutral_1: "The skyline echoes with regal laughter."
      neutral_2: "The fountain flows ominously."
      neutral_3: "Smells like overclocked high heels."
      neutral_4: "Moss feels you with DETERMINATION."
    talk_stages:
      - last: 4
      - last: 8
        wait_quest: "defeat_queen"
        wait_for: "completed"
    type: "boss"
    hp: 500

  sans:
    name: "Sans"
    description: "It's Sans the skeleton!"
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      default: "Hello!"
    type: "boss"
    hp: 20

  susie:
    name: "Susie"
    description: "Your best friend, Susie!"
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "Hey. What's up?"
      talk_2: "Hey! I know where the other key is. You want it?"
      talk_3: "But I can't give it like that. I want something."
      talk_4: "Hum... Let me think..."
      talk_5: "I know!"
      talk_6: "I want a chocolate cake. Bring me that."
      talk_7: "You should talk to Ralsei. He knows how to cook unlike you."
      talk_8: "Where's my chocolate cake?"
      talk_9: "Oh! Thanks you."
      talk_10: "Yummy. Here's the key."
      talk_11: "I'm eating. Go away."
    talk_stages:
      - last: 1
        wait_quest: "find_key_b"
        wait_for: "have"
      - last: 8
        wait_quest: "talk_to_susie"
        wait_for: "have"
      - last: 11
    type: "npc"
    hp: 999

  ralsei:
    name: "Ralsei"
    description: "The prince of the Dark World and also your best friend."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "Hey!"
      talk_2: "You want to do a cake? Well, I can do it..."
      talk_3: "I just need those ingredients."
      talk_4: "Wheat,"
      talk_5: "A chocolate bar,"
      talk_6: "And milk."
      talk_7: "You have everything?"
      talk_8: "I can do the cake know. Wait a minute."
      talk_9: "Here your cake. Have a good meal!"
      talk_10: "The cake was good?"
    talk_stages:
      - last: 1
      - last: 7
        wait_quest: "find_ralsei"
        wait_for: "have"
      - last: 10
    type: "npc"
    hp: 999

  holy_cow:
    name: "Holy Cow"
    description: "A cow blessed by the powered of 'HOLY'(TM) the best drinking of the world!"
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "Moo!"
      talk_2: "Moo, moo?"
      talk_3: "Moo... Moo, moooo, moo."
      talk_4: "Moo! Moo, moo? Mooooo."
    type: "npc"
    hp: 999

  spamton:
    name: "Spamton"
    description: "He wants to make a DEAL, but don't give him your MONEY!"
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      talk_1: "YOU [Little Sponge]! I KNEW YOU'D COME HERE [[On A Saturday Night]]"
      talk_2: "AFTER ALL, YOU WANNA BE A [Big Shot]! EAHAHAHAHAA!!"
      talk_3: "COME TO MY [Shopping Mall]."
      talk_4: "YOU HAVE [[pipis]] [[pipis]] [[pipis]] [[pipis]] [[pipis]] [[pipis]] [[pipis]]"
      talk_5: "I GIVE YOU A [Big Deal]. HERE [[hyperlink blocked]]."
      shop_1: "WELCOME TO MY HOME [Shopping Center]!!!"
      shop_2: "LET'S MAKE A DEAL."
      no_money: "MONEY NO [Not enought D$]"
      buy: "DEALS SO GOOD I'LL [$!$$] MYSELF!"
      remote: "CAN'T [buy] THIS. PRECIOUS. BUT [[pipis]] NOT FOUND. BRING BACK [[pipis]]. [7]"
      quit: "HURRY UP AND BUY. NO [exit], NO [return back]!!"
    talk_stages:
      - last: 3
        wait_quest: "find_spamton"
        wait_for: "completed"
      - last: 5
        wait_quest: "bring_pipis"
        wait_for: "completed"
      - last: 10
    type: "shop"
    hp: 999

  swatch:
    name: "Swatch"
    description: "He like juice."
    sprite: "assets/sprites/player/kris_walk.png"
    dialogue:
      shop_1: "..."
      no_money: ":["
      buy: ":}"
      quit: ";)"
    type: "shop"
    hp: 999

# --- QUESTS ---
quests:
  defeat_queen:
    name: "Defeat Queen"
    description: "Find the Queen. She have taken your delicious and precious moss."
    spawn_with_quest: true

  find_queen_castle:
    name: "Find a way to go in the Queen's Castle"
    description: "The gate is closed... You can try to fight the Guard Dog or try something else?"

  defeat_guard_dog:
    name: "Fight the Guard Dog"
    description: "Maybe you can try to defeat him and force your way trought?"

  defeat_k_round:
    name: "Defeat K.Round"
    description: "You start the fight. Now it's time to pass!"

  find_spamton:
    name: "A strange sound..."
    description: "Investigate the strange noise in the trash area."

  buy_remote:
    name: "Buy the 'Remote'"
    description: "Spamton sell a strange remote that can, maybe, open the gates..."

  bring_pipis:
    name: "Get 7 'Pipis' to Spamton"
    description: "He just want that in exchange of the remote... strange?"

  talk_to_spamton:
    name: "Return to Spamton"
    description: "You've got the Pipis! Go see Spamton!"

  find_key_b:
    name: "Find the other key"
    description: "You need a second key to open the castle doors. Find it!"

  find_ralsei:
    name: "Find Ralsei"
    description: "Susie want's a chocolate cake and only Ralsei can do it. Find him."

  find_chocolate_bar:
    name: "Find the chocolate bar"
    description: "todo"

  find_milk:
    name: "Find the milk"
    description: "todo"

  find_wheat:
    name: "Find the milk"
    description: "Maybe you can find a cow?"

  talk_to_ralsei:
    name: "Return talk to Ralsei"
    description: "You gather the 3 ingredients. Go see Ralsei again."

  talk_to_susie:
    name: "Give the chocolate cake"
    description: "Susie is hungry! Hurry up!"
